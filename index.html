<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasveer aur Link</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 50px;
        }
        .link-container {
            display: inline-block;
            text-decoration: none;
            color: inherit;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 300px;
            transition: transform 0.2s;
        }
        .link-container:hover {
            transform: scale(1.02);
        }
        .link-container img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
        .link-info {
            text-align: left;
            margin-top: 10px;
        }
        .link-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a0dab;
            margin: 5px 0;
        }
        .link-desc {
            font-size: 14px;
            color: #545454;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Jab aap tasveer par click karenge toh yeh fbdnc.com par le jayega -->
    <a href="https://fbdnc.com" target="_blank" class="link-container">
        <!-- https://github.com/hainji60-byte/congenial-broccolifwef/blob/main/MiConv.com__377804186863468205.webp?raw=true -->
        <img src="https://via.placeholder.com/300x180" alt="Sample Image">
        
        <!-- Tasveer ke neeche Title aur Description -->
        <div class="link-info">
            <div class="link-title">FBDNC - Official Website</div>
            <p class="link-desc">https://blog.sentbola.xyz/top-10-world-class-hospitals-in-singapore-for-exceptional-healthcare/.</p>
        </div>
    </a>

</body>
</html>
